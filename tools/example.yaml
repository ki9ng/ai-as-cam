# Template tool library. One entry per tool. Your agent builds this with you during setup
# and updates it after test coupons and post-mortems. Never invent numbers: leave a value
# out if you don't know it, and mark where every cutting number came from:
#   measured      cut and confirmed on this machine
#   manufacturer  from the tool maker's published data (add url:)
#   starting      a value the user chose to try
tools:
  - id: T1
    name: 1/8 in 2-flute flat end mill
    type: flat_endmill          # flat_endmill | ball_endmill | bull_endmill | v_bit | o_flute | drill | engraver
    geometry:
      diameter_mm: 3.175
      flutes: 2
      flute_length_mm: 12
      stickout_mm: 18           # as clamped; affects deflection
      corner_radius_mm: 0       # ball/bull only
      # v_angle_deg: 60         # v-bits
      # tip_mm: 0.1             # v-bits / engravers
    tool_material: carbide
    coating: none
    materials:                  # cutting data per workpiece material
      aluminium_6061:
        status: untested        # untested | coupon_passed | proven
        rpm: {value: 10000, source: starting}       # source: measured | manufacturer | starting
        feed_mm_min: {value: 300, source: starting}
        plunge_mm_min: {value: 60, source: starting}
        doc_mm: {value: 0.3, source: starting}
        stepover_mm: {value: 1.0, source: starting}
        # feed_mm_min: {value: 450, source: manufacturer, url: https://..., note: rigid-machine chart}
        ops: {}                 # optional per-strategy overrides, e.g. trochoid: {loop_r_mm: {value: 0.6, source: measured}}
    history: []                 # post-mortem files about this tool, e.g. postmortems/2026-01-15-broken-bit.md
